# Quarry base-terrain pipeline configuration.
# Fields marked FILL ME must be supplied by you; the pipeline stops and asks
# rather than guessing them.

run_id: auto            # auto-increments v001, v002... (or pin e.g. v003)
aoi:
  # WGS84 lon/lat of the area of interest; the user supplies these   <-- FILL ME
  west: null
  south: null
  east: null
  north: null
  buffer_m: 500         # extra margin so edges don't clip the site
crs_epsg: 32635         # UTM 35N; units meters, Z up
dem:
  source: COP30         # OpenTopography demtype; COP30 preferred over SRTMGL1 (SRTM is from 2000, before most of the excavation)
  target_resolution_m: 30   # keep native; set lower (e.g., 10) only for smoother render meshes, logged as resampled
  resampling: bilinear  # nearest | bilinear | cubic (used when reprojecting the DEM to UTM)
imagery:
  mode: esri_tiles      # esri_tiles | user_geotiff | none
  zoom: 17
  user_geotiff: null    # path to a georeferenced GeoTIFF when mode = user_geotiff
  # Extra settings for esri_tiles mode (defaults are fine):
  tile_url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
  throttle_s: 0.15      # pause between tile requests
  max_tiles: 3000       # safety cap; lower the zoom if the AOI needs more
  resampling: bilinear  # used when reprojecting the imagery to UTM
blender:
  path: null            # <-- FILL ME (or set BLENDER_PATH), e.g. /Applications/Blender.app/Contents/MacOS/Blender
  mesh_decimate_ratio: 1.0   # 1.0 = one vertex per DEM cell
  check_render_px: 1600      # long side of the stage 06 check renders
  check_render_samples: 32   # Cycles samples for check renders
gaea:
  size_px: 2048         # square heightmap
  bit_depth: 16
rhino:
  formats: [obj, fbx]
terraces:               # stage 07 - INTERPRETED benches from imagery + DEM (base stays measured)
  enabled: true
  resolution_m: 2.0         # interpreted grid (divides the DEM cell)
  bench_height_m: auto      # auto = estimated from imagery+DEM (~2% accurate); set e.g. 12 if you know it (better levels)
  bench_height_range_m: [5, 25]
  face_angle_deg: 70        # bench face angle (not measurable from imagery)
  min_slope_deg: 8          # flatter areas (pit floor) keep the measured shape
  surface_smoothing_m: 20
  local_window_m: 30        # window for the local DEM correction to the bench levels
  pit_mask: null            # optional GeoJSON polygon of the pit (lon/lat or project CRS)
  pit_threshold: null       # optional fixed imagery threshold if auto-detection fails
  pit_min_area_m2: 20000
  pit_min_local_relief_m: 3
  margin_m: 150             # mesh = pit bbox + margin
  mesh_max_vertices: 3000000
  require_significant: true # stop and ask when no part of the pit shows a bench pattern
  region_size_m: 400        # benches are tested region by region (several pits/dumps, newer digging)
  min_significance: 2.0     # a region's pattern must beat shifted edge maps by this factor
  bare_ground_only: true    # look for benches on bare rock/soil only, not on vegetation
  max_bench_width_m: 60     # wider implied bench floors are not quarry benches
  method: auto              # auto = confirmed benches where the elevation data allows, plus benches cut
                            #        along the photo's bench lines elsewhere (illustrative) | measured | traced
  quarry_min_area_ha: 5     # automatic quarry area: smallest body kept (separates farmland, buildings)
  line_min_length_m: 18     # bench lines shorter than this are ignored (rubble, blocks)
  bench_smoothing_m: 30     # how strongly the ground between bench lines is flattened
  max_cut_m: 12             # largest change allowed by the cut benches
